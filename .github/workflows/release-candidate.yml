name: Build release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local_inspection_service/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build production frontend
        working-directory: local_inspection_service/frontend
        run: npm ci && npm run build:production-cutover
      - name: Verify release contract
        run: python scripts/verify_release_contract.py
      - name: Package immutable candidate
        env:
          RELEASE_ID: candidate-${{ github.run_number }}-${{ github.sha }}
        run: |
          python scripts/build_release_artifact.py \
            --release "$RELEASE_ID" \
            --git-commit "${{ github.sha }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "release-output/$RELEASE_ID.tar.gz"
          sha256sum release-output/*.tar.gz > release-output/ARTIFACT_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vantaline-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

# Automatic production deployment is intentionally absent until the baseline
# PR, release tag, and rollback rehearsal have all passed.
