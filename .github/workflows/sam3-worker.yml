name: Build SAM3 worker
on:
  push:
    branches: [feature/runpod-sam3-extraction]
    paths:
      - local_inspection_service/workers/vantaline_sam3_worker/**
      - .github/workflows/sam3-worker.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: local_inspection_service/workers/vantaline_sam3_worker
          push: true
          tags: ghcr.io/jeffreydeng-spec/vantaline-sam3-worker:${{ github.sha }}
          platforms: linux/amd64
      - name: Record immutable digest
        run: echo '${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Require private package before deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api /users/jeffreydeng-spec/packages/container/vantaline-sam3-worker --jq .visibility)
          if [ "$visibility" != private ]; then
            echo 'Package is not private; deployment is blocked.' >&2
            exit 1
          fi
