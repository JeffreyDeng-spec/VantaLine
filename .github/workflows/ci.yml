        run: python local_inspection_service/scripts/smoke_text_inspection_v2_endpoints.py
      - name: Verify text inspection API enabled mode
        env:
          VANTALINE_TEXT_V2_SMOKE_MODE: enabled
        run: python local_inspection_service/scripts/smoke_text_inspection_v2_endpoints.py
