name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-image-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow
      - run: python scripts/build_doc_image_extractor.py --output "$RUNNER_TEMP/doc-image-bundle"
      - name: Validate locked runtime
        run: VANTALINE_DOC_IMAGE_BUNDLE="$RUNNER_TEMP/doc-image-bundle" python -c 'from local_inspection_service.document_images import _runtime; _runtime()'
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime and secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|uploads|outputs|logs|backups|node_modules|dist-production|__pycache__)(/|$)|\.(pem|key|sqlite3?|db|dump)$|server\.py\.bak'
          if git ls-files | grep -E "$forbidden"; then
            echo 'Forbidden generated, runtime, backup, database, or secret file is tracked.' >&2
            exit 1
          fi
      - name: Verify PLC release contract
        run: python scripts/verify_release_contract.py
      - name: Verify browser camera and file-drop contracts
        run: python local_inspection_service/scripts/smoke_frontend_media_inputs.py
      - name: Validate release shell syntax
        run: bash -n scripts/bootstrap_release_host.sh scripts/install_release.sh
      - name: Keep mutable backgrounds outside immutable releases
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BACKGROUND_DIR = DATA_DIR / "backgrounds"' local_inspection_service/server.py
          grep -F 'shared_backgrounds="$base/shared/data/backgrounds"' scripts/install_release.sh
          grep -F 'install -o root -g root -m 0755 "$target/scripts/install_release.sh" "$installer_tmp"' scripts/install_release.sh
          grep -F 'mv -Tf "$installer_tmp" "$installer_path"' scripts/install_release.sh

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test documentation impact fixtures
        run: python scripts/verify_docs_contract.py --self-test
      - name: Verify documentation contract and PR impact
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${BASE_REF:-}" ]]; then args+=(--base-ref "$BASE_REF"); fi
          python scripts/verify_docs_contract.py "${args[@]}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local_inspection_service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local_inspection_service/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:plc-capture
      - name: Install pinned navigation test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify public/workspace navigation
        env:
          NAVIGATION_UI_OUTPUT: ${{ runner.temp }}/navigation-ui
        run: npm run test:navigation && node ../../scripts/test_label_workspace_ui.cjs && node ../../scripts/test_settings_ui.cjs
      - name: Upload navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-ui
          path: ${{ runner.temp }}/navigation-ui
          if-no-files-found: ignore
      - name: Verify Codex comparison report UI
        env:
          REVIEW_UI_BASE: http://127.0.0.1:5190/react-preview
          CODEX_UI_OUTPUT: ${{ runner.temp }}/codex-ui
        run: |
          npm run dev -- --host 127.0.0.1 --port 5190 > "$RUNNER_TEMP/codex-vite.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:5190/react-preview/tests/codex-compare.html >/dev/null
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" node ../../scripts/test_codex_compare_ui.cjs
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" node ../../scripts/test_label_batch_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-report-ui
          path: ${{ runner.temp }}/codex-ui
          if-no-files-found: ignore
      - run: npm run test:agent
      - run: npm run typecheck
      - run: npm run build:production-cutover
      - name: Verify built protocol
        working-directory: .
        run: python scripts/verify_release_contract.py

  backend-plc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vantaline
          POSTGRES_PASSWORD: vantaline_ci
          POSTGRES_DB: vantaline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantaline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VANTALINE_POSTGRES_DSN: postgresql://vantaline:vantaline_ci@127.0.0.1:5432/vantaline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-production.lock
      - run: python scripts/verify_production_dependencies.py requirements-production.lock
      - name: Verify additive-only migrations
        run: python scripts/verify_migration_safety.py
      - run: python scripts/smoke_migration_safety.py
      - run: python -m py_compile local_inspection_service/server.py local_inspection_service/plc_fx_ascii.py local_inspection_service/plc_web_serial.py local_inspection_service/release_version.py
      # Phase 1/1-hardening exercise the retired server-side pyserial dispatcher.
      # Production v4 is browser-owned Web Serial and the server must perform 0
      # serial I/O, so only the frozen-history verifier remains in source.
      - run: python local_inspection_service/scripts/smoke_plc_web_serial_v3.py
      - run: python local_inspection_service/scripts/smoke_plc_frontend_contract.py
      - run: python local_inspection_service/scripts/smoke_release_version.py
      - run: python local_inspection_service/scripts/smoke_navigation_endpoints.py
      - run: python local_inspection_service/scripts/smoke_postgres_runtime_repository.py
      - name: Verify text inspection comparison and document contracts
