name: Diagnostic only - do not merge or deploy
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  phase-diagnostics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vantaline
          POSTGRES_PASSWORD: vantaline_ci
          POSTGRES_DB: vantaline
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U vantaline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VANTALINE_POSTGRES_DSN: postgresql://vantaline:vantaline_ci@127.0.0.1:5432/vantaline
    steps:
    - uses: actions/checkout@v4
      with:
        path: diagnostic
      timeout-minutes: 3
    - uses: actions/checkout@v4
      with:
        ref: c08d1e92d7a2904b0a488a1384cd25dec1f6c07a
        path: accepted
        fetch-depth: 2
      timeout-minutes: 3
    - uses: actions/checkout@v4
      with:
        ref: fe0c88de246631b8df4445f0fb0120cd151855df
        path: candidate
        fetch-depth: 2
      timeout-minutes: 3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: candidate/requirements-production.lock
      timeout-minutes: 5
    - name: Bind identical installation locks
      run: 'cmp accepted/requirements-production.lock candidate/requirements-production.lock

        sha256sum accepted/requirements-production.lock candidate/requirements-production.lock

        python --version

        '
    - name: Install the exact original dependency lock once
      working-directory: candidate
      run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-production.lock
      timeout-minutes: 20
    - name: Run one mirrored attribution study, never acceptance
      run: python -B diagnostic/scripts/run_hosted_phase_diagnostic.py --base-root accepted --candidate-root candidate --output-directory
        diagnostic-evidence
      timeout-minutes: 30
    - name: Capture isolated synthetic PostgreSQL service log
      if: always()
      run: docker logs ${{ job.services.postgres.id }} > diagnostic-postgres.log 2>&1
      timeout-minutes: 2
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: private-plc-tail-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'diagnostic-evidence/

          diagnostic-postgres.log

          '
        retention-days: 30
        if-no-files-found: error
      timeout-minutes: 3
    timeout-minutes: 75
