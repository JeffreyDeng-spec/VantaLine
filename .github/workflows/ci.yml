  codex-comparison:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vantaline
          POSTGRES_PASSWORD: vantaline_ci
          POSTGRES_DB: vantaline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vantaline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEX_TEST_DATABASE_URL: postgresql://vantaline:vantaline_ci@127.0.0.1:5432/vantaline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install -c requirements-production.lock pillow opencv-python-headless 'psycopg[binary]' fastapi python-multipart httpx pytest
      - run: python -m pytest tests/codex_compare -q
